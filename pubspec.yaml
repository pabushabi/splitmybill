name: splitmybill
description: "Приложение для разделения счёта в ресторане между гостями."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  characters: ^1.4.0

  # state management
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0

  # models
  freezed_annotation: ^3.1.0

  # di
  get_it: ^9.2.1
  injectable: ^3.0.0

  # navigation
  go_router: ^17.5.0

  # storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # camera & images
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  crop_your_image: ^2.0.0
  image: ^4.9.2
  permission_handler: ^13.0.1

  # ocr
  flutter_tesseract_ocr: ^0.4.31
  google_mlkit_text_recognition: ^0.17.1

  # misc
  uuid: ^4.6.0
  intl: 0.20.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^3.2.5
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/tessdata/
    - assets/tessdata_config.json
