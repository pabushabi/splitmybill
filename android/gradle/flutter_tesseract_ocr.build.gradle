group 'io.paratoner.flutter_tesseract_ocr'
version '1.0'

// Патч под Gradle 9 / AGP 9: оригинальный скрипт плагина вызывает удалённый jcenter()
// и тянет AGP 7.1.2. Этот файл подставляется из settings.gradle.kts перед сборкой.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs project(':flutter_tesseract_ocr').file('libs')
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace "io.paratoner.flutter_tesseract_ocr"
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    api(name: 'tesseract4android-release', ext: 'aar')
}
